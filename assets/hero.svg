<svg width="100%" height="500" viewBox="0 0 1200 500"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030409"/>
      <stop offset="50%" stop-color="#0a0d1a"/>
      <stop offset="100%" stop-color="#030409"/>
    </linearGradient>

    <!-- Main futuristic gradient -->
    <linearGradient id="gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Cyan gradient -->
    <linearGradient id="cyan" x1="0" x2="1">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow -->
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">

      <path d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.045"/>

    </pattern>

    <!-- Moving light -->
    <linearGradient id="scan">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f5ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0"/>
    </linearGradient>

  </defs>


  <!-- ================================= -->
  <!-- BACKGROUND -->
  <!-- ================================= -->

  <rect width="1200"
        height="500"
        rx="28"
        fill="url(#bg)"/>

  <rect width="1200"
        height="500"
        rx="28"
        fill="url(#grid)"/>


  <!-- Ambient glow -->

  <circle cx="930"
          cy="245"
          r="170"
          fill="#6366f1"
          opacity="0.04">

    <animate attributeName="r"
             values="150;190;150"
             dur="5s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0.02;0.07;0.02"
             dur="5s"
             repeatCount="indefinite"/>

  </circle>


  <!-- ================================= -->
  <!-- SYSTEM STATUS -->
  <!-- ================================= -->

  <circle cx="70"
          cy="65"
          r="6"
          fill="#22c55e"
          filter="url(#glow)">

    <animate attributeName="r"
             values="5;7;5"
             dur="1.5s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="1;0.35;1"
             dur="1.5s"
             repeatCount="indefinite"/>

  </circle>

  <text x="90"
        y="72"
        fill="#9ca3af"
        font-family="monospace"
        font-size="17">

    SYSTEM ONLINE

  </text>


  <!-- ================================= -->
  <!-- TITLE -->
  <!-- ================================= -->

  <text x="70"
        y="185"
        fill="#ffffff"
        font-family="Arial, sans-serif"
        font-size="64"
        font-weight="700">

    FARDEEN KHAN

  </text>


  <!-- Animated underline -->

  <rect x="72"
        y="205"
        width="430"
        height="4"
        rx="2"
        fill="url(#gradient)"
        filter="url(#glow)">

    <animate attributeName="width"
             values="120;430;280;430"
             dur="4s"
             repeatCount="indefinite"/>

  </rect>


  <!-- ================================= -->
  <!-- DESCRIPTION -->
  <!-- ================================= -->

  <text x="70"
        y="255"
        fill="#e5e7eb"
        font-family="monospace"
        font-size="21">

    AI / ML ENGINEER • DEVELOPER

  </text>

  <text x="70"
        y="295"
        fill="#6b7280"
        font-family="monospace"
        font-size="16">

    Building intelligent systems &amp; digital experiences.

  </text>


  <!-- ================================= -->
  <!-- COMMANDS -->
  <!-- ================================= -->

  <text x="70"
        y="365"
        fill="#00f5ff"
        font-family="monospace"
        font-size="18">

    &gt; BUILD

  </text>

  <text x="190"
        y="365"
        fill="#818cf8"
        font-family="monospace"
        font-size="18">

    LEARN

  </text>

  <text x="300"
        y="365"
        fill="#ec4899"
        font-family="monospace"
        font-size="18">

    CREATE

  </text>


  <!-- ================================= -->
  <!-- AI CORE -->
  <!-- ================================= -->

  <!-- Outer rotating ring -->

  <circle cx="930"
          cy="245"
          r="105"
          fill="none"
          stroke="url(#gradient)"
          stroke-width="1.5"
          stroke-opacity="0.35">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 930 245"
      to="360 930 245"
      dur="16s"
      repeatCount="indefinite"/>

  </circle>


  <!-- Outer orbit -->

  <ellipse cx="930"
           cy="245"
           rx="120"
           ry="45"
           fill="none"
           stroke="#00f5ff"
           stroke-opacity="0.25"
           stroke-width="1">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 930 245"
      to="360 930 245"
      dur="9s"
      repeatCount="indefinite"/>

  </ellipse>


  <!-- Second orbit -->

  <ellipse cx="930"
           cy="245"
           rx="45"
           ry="120"
           fill="none"
           stroke="#ec4899"
           stroke-opacity="0.25"
           stroke-width="1">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="360 930 245"
      to="0 930 245"
      dur="11s"
      repeatCount="indefinite"/>

  </ellipse>


  <!-- Inner ring -->

  <circle cx="930"
          cy="245"
          r="68"
          fill="none"
          stroke="#6366f1"
          stroke-opacity="0.5"
          stroke-width="1.5">

    <animate attributeName="r"
             values="62;75;62"
             dur="3s"
             repeatCount="indefinite"/>

  </circle>


  <!-- ================================= -->
  <!-- CORE ENERGY -->
  <!-- ================================= -->

  <circle cx="930"
          cy="245"
          r="35"
          fill="#00f5ff"
          opacity="0.08"
          filter="url(#strongGlow)">

    <animate attributeName="r"
             values="30;50;30"
             dur="2.5s"
             repeatCount="indefinite"/>

  </circle>


  <circle cx="930"
          cy="245"
          r="22"
          fill="url(#gradient)"
          filter="url(#strongGlow)">

    <animate attributeName="r"
             values="18;25;18"
             dur="2s"
             repeatCount="indefinite"/>

  </circle>


  <!-- ================================= -->
  <!-- NEURAL NODES -->
  <!-- ================================= -->

  <!-- Top -->

  <circle cx="930"
          cy="125"
          r="5"
          fill="#00f5ff"
          filter="url(#glow)">

    <animate attributeName="cy"
             values="125;118;125"
             dur="2s"
             repeatCount="indefinite"/>

  </circle>


  <!-- Right -->

  <circle cx="1050"
          cy="245"
          r="5"
          fill="#a855f7"
          filter="url(#glow)">

    <animate attributeName="cx"
             values="1050;1057;1050"
             dur="2.3s"
             repeatCount="indefinite"/>

  </circle>


  <!-- Bottom -->

  <circle cx="930"
          cy="365"
          r="5"
          fill="#ec4899"
          filter="url(#glow)">

    <animate attributeName="cy"
             values="365;372;365"
             dur="1.8s"
             repeatCount="indefinite"/>

  </circle>


  <!-- Left -->

  <circle cx="810"
          cy="245"
          r="5"
          fill="#00f5ff"
          filter="url(#glow)">

    <animate attributeName="cx"
             values="810;803;810"
             dur="2.1s"
             repeatCount="indefinite"/>

  </circle>


  <!-- Diagonal nodes -->

  <circle cx="845"
          cy="160"
          r="4"
          fill="#818cf8"
          filter="url(#glow)"/>

  <circle cx="1015"
          cy="160"
          r="4"
          fill="#ec4899"
          filter="url(#glow)"/>

  <circle cx="1015"
          cy="330"
          r="4"
          fill="#818cf8"
          filter="url(#glow)"/>

  <circle cx="845"
          cy="330"
          r="4"
          fill="#00f5ff"
          filter="url(#glow)"/>


  <!-- ================================= -->
  <!-- NEURAL CONNECTIONS -->
  <!-- ================================= -->

  <g fill="none"
     stroke-width="1"
     stroke-opacity="0.35">

    <line x1="930" y1="223"
          x2="930" y2="130"
          stroke="#00f5ff"/>

    <line x1="952" y1="245"
          x2="1045" y2="245"
          stroke="#a855f7"/>

    <line x1="930" y1="267"
          x2="930" y2="360"
          stroke="#ec4899"/>

    <line x1="908" y1="245"
          x2="815" y2="245"
          stroke="#00f5ff"/>

    <line x1="915" y1="230"
          x2="850" y2="165"
          stroke="#818cf8"/>

    <line x1="945" y1="230"
          x2="1010" y2="165"
          stroke="#ec4899"/>

    <line x1="945" y1="260"
          x2="1010" y2="325"
          stroke="#818cf8"/>

    <line x1="915" y1="260"
          x2="850" y2="325"
          stroke="#00f5ff"/>

  </g>


  <!-- ================================= -->
  <!-- MOVING DATA PARTICLES -->
  <!-- ================================= -->

  <circle r="3"
          fill="#00f5ff"
          filter="url(#glow)">

    <animateMotion
      path="M930 125 L930 223"
      dur="1.2s"
      repeatCount="indefinite"/>

  </circle>


  <circle r="3"
          fill="#a855f7"
          filter="url(#glow)">

    <animateMotion
      path="M1050 245 L952 245"
      dur="1.4s"
      repeatCount="indefinite"/>

  </circle>


  <circle r="3"
          fill="#ec4899"
          filter="url(#glow)">

    <animateMotion
      path="M930 365 L930 267"
      dur="1.3s"
      repeatCount="indefinite"/>

  </circle>


  <circle r="3"
          fill="#00f5ff"
          filter="url(#glow)">

    <animateMotion
      path="M810 245 L908 245"
      dur="1.1s"
      repeatCount="indefinite"/>

  </circle>


  <!-- ================================= -->
  <!-- AI CORE LABEL -->
  <!-- ================================= -->

  <text x="930"
        y="415"
        text-anchor="middle"
        fill="#6b7280"
        font-family="monospace"
        font-size="13">

    AI CORE • PROCESSING

  </text>


  <!-- ================================= -->
  <!-- SCAN LINE -->
  <!-- ================================= -->

  <rect x="0"
        y="0"
        width="1200"
        height="2"
        fill="url(#scan)"
        opacity="0.5">

    <animate attributeName="y"
             values="0;498;0"
             dur="7s"
             repeatCount="indefinite"/>

  </rect>


  <!-- ================================= -->
  <!-- FOOTER -->
  <!-- ================================= -->

  <text x="70"
        y="450"
        fill="#4b5563"
        font-family="monospace"
        font-size="14">

    FARDEEN // AI SYSTEM

  </text>

  <text x="1050"
        y="450"
        fill="#4b5563"
        font-family="monospace"
        font-size="14">

    v1.1

  </text>

</svg>