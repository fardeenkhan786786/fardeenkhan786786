<svg width="100%" height="500" viewBox="0 0 1200 500"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="50%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <!-- Main gradient -->
    <linearGradient id="mainGradient" x1="0" x2="1">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid" width="40" height="40"
             patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.05"/>
    </pattern>

    <!-- Gradient animation -->
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#00f5ff"
            stop-opacity="0.8"/>
      <stop offset="100%" stop-color="transparent"/>

      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        from="-1 0"
        to="2 0"
        dur="4s"
        repeatCount="indefinite"/>
    </linearGradient>

  </defs>


  <!-- BACKGROUND -->

  <rect width="1200" height="500"
        rx="28"
        fill="url(#bg)"/>

  <rect width="1200" height="500"
        rx="28"
        fill="url(#grid)"/>


  <!-- BACKGROUND GLOW -->

  <circle cx="150" cy="100" r="160"
          fill="#00f5ff"
          opacity="0.06">
    <animate attributeName="opacity"
             values="0.03;0.10;0.03"
             dur="4s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="1050" cy="400" r="200"
          fill="#a855f7"
          opacity="0.06">
    <animate attributeName="opacity"
             values="0.03;0.09;0.03"
             dur="5s"
             repeatCount="indefinite"/>
  </circle>


  <!-- TOP STATUS -->

  <circle cx="70" cy="65" r="6"
          fill="#22c55e"
          filter="url(#glow)">

    <animate attributeName="opacity"
             values="1;0.3;1"
             dur="1.5s"
             repeatCount="indefinite"/>

  </circle>

  <text x="90" y="72"
        fill="#9ca3af"
        font-family="monospace"
        font-size="18">
    SYSTEM ONLINE
  </text>


  <!-- MAIN TITLE -->

  <text x="70" y="185"
        fill="white"
        font-family="Arial, sans-serif"
        font-size="64"
        font-weight="700">
    FARDEEN KHAN
  </text>


  <!-- GRADIENT LINE -->

  <rect x="72" y="205"
        width="430"
        height="4"
        rx="2"
        fill="url(#mainGradient)"
        filter="url(#glow)">

    <animate attributeName="width"
             values="100;430;300;430"
             dur="4s"
             repeatCount="indefinite"/>

  </rect>


  <!-- SUBTITLE -->

  <text x="70" y="255"
        fill="#d1d5db"
        font-family="monospace"
        font-size="22">
    AI / ML ENGINEER • DEVELOPER
  </text>

  <text x="70" y="295"
        fill="#6b7280"
        font-family="monospace"
        font-size="17">
    Building intelligent systems &amp; digital experiences.
  </text>


  <!-- COMMAND -->

  <text x="70" y="365"
        fill="#00f5ff"
        font-family="monospace"
        font-size="18">
    &gt; BUILD
  </text>

  <text x="190" y="365"
        fill="#a855f7"
        font-family="monospace"
        font-size="18">
    LEARN
  </text>

  <text x="300" y="365"
        fill="#ec4899"
        font-family="monospace"
        font-size="18">
    CREATE
  </text>


  <!-- RIGHT AI CORE -->

  <circle cx="930" cy="245"
          r="95"
          fill="none"
          stroke="url(#mainGradient)"
          stroke-width="2"
          opacity="0.4">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 930 245"
      to="360 930 245"
      dur="12s"
      repeatCount="indefinite"/>

  </circle>


  <circle cx="930" cy="245"
          r="65"
          fill="none"
          stroke="#00f5ff"
          stroke-width="1"
          opacity="0.5">

    <animate attributeName="r"
             values="60;72;60"
             dur="3s"
             repeatCount="indefinite"/>

  </circle>


  <!-- CORE -->

  <circle cx="930" cy="245"
          r="20"
          fill="url(#mainGradient)"
          filter="url(#glow)">

    <animate attributeName="r"
             values="18;24;18"
             dur="2s"
             repeatCount="indefinite"/>

  </circle>


  <!-- NETWORK NODES -->

  <circle cx="930" cy="145" r="5"
          fill="#00f5ff"
          filter="url(#glow)"/>

  <circle cx="1030" cy="245" r="5"
          fill="#a855f7"
          filter="url(#glow)"/>

  <circle cx="930" cy="345" r="5"
          fill="#ec4899"
          filter="url(#glow)"/>

  <circle cx="830" cy="245" r="5"
          fill="#00f5ff"
          filter="url(#glow)"/>


  <!-- CONNECTIONS -->

  <line x1="930" y1="225"
        x2="930" y2="150"
        stroke="#00f5ff"
        stroke-opacity="0.4"/>

  <line x1="950" y1="245"
        x2="1025" y2="245"
        stroke="#a855f7"
        stroke-opacity="0.4"/>

  <line x1="930" y1="265"
        x2="930" y2="340"
        stroke="#ec4899"
        stroke-opacity="0.4"/>

  <line x1="910" y1="245"
        x2="835" y2="245"
        stroke="#00f5ff"
        stroke-opacity="0.4"/>


  <!-- MOVING SCAN -->

  <rect x="0" y="0"
        width="1200"
        height="500"
        fill="url(#scan)"
        opacity="0.08"/>


  <!-- FOOTER -->

  <text x="70" y="450"
        fill="#4b5563"
        font-family="monospace"
        font-size="14">
    FARDEEN // AI SYSTEM
  </text>

  <text x="1050" y="450"
        fill="#4b5563"
        font-family="monospace"
        font-size="14">
    v1.0
  </text>

</svg>