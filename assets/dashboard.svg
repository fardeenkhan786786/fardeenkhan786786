<svg width="100%" height="360" viewBox="0 0 1200 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060b"/>
      <stop offset="50%" stop-color="#0b0e1c"/>
      <stop offset="100%" stop-color="#05060b"/>
    </linearGradient>

    <!-- Cell gradient -->
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Bright cell -->
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid"
             width="30"
             height="30"
             patternUnits="userSpaceOnUse">

      <path d="M30 0H0V30"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.025"/>

    </pattern>

  </defs>


  <!-- BACKGROUND -->

  <rect width="1200"
        height="360"
        rx="28"
        fill="url(#bg)"/>

  <rect width="1200"
        height="360"
        rx="28"
        fill="url(#grid)"/>


