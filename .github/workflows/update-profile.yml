name: Update GitHub Contribution Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and generate contribution matrix
        run: |
          python - <<'PY'
          import urllib.request
          import re
          from datetime import datetime, timedelta

          USERNAME = "fardeenkhan786786"
          URL = f"https://github.com/users/{USERNAME}/contributions"

          print("Fetching GitHub contribution data...")

          request = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(request) as response:
              html = response.read().decode("utf-8")

          # Find every contribution cell.
          cells = re.findall(
              r'<td\b[^>]*class="[^"]*ContributionCalendar-day[^"]*"[^>]*>',
              html
          )

          contributions = []

          for cell in cells:
              date_match = re.search(
                  r'data-date="([^"]+)"',
                  cell
              )

              level_match = re.search(
                  r'data-level="([0-4])"',
                  cell
              )

              if date_match and level_match:
                  contributions.append({
                      "date": date_match.group(1),
                      "level": int(level_match.group(1))
                  })

          if not contributions:
              raise SystemExit(
                  "ERROR: No contribution cells were found."
              )

          print(
              f"Found {len(contributions)} contribution days."
          )

          # Sort by date.
          contributions.sort(
              key=lambda item: item["date"]
          )

          # ---------------------------------------------------------
          # SVG SETTINGS
          # ---------------------------------------------------------

          width = 1100
          height = 330

          cell_size = 13
          gap = 5

          start_x = 55
          start_y = 80

          colors = {
              0: "#111827",
              1: "#123B4A",
              2: "#075985",
              3: "#0891B2",
              4: "#22D3EE"
          }

          svg = f'''<svg
          xmlns="http://www.w3.org/2000/svg"
          width="{width}"
          height="{height}"
          viewBox="0 0 {width} {height}">

          <defs>

            <linearGradient
              id="bg"
              x1="0"
              y1="0"
              x2="1"
              y2="1">

              <stop
                offset="0%"
                stop-color="#050816"/>

              <stop
                offset="50%"
                stop-color="#0B1025"/>

              <stop
                offset="100%"
                stop-color="#12051F"/>

            </linearGradient>

            <linearGradient
              id="title"
              x1="0"
              y1="0"
              x2="1"
              y2="0">

              <stop
                offset="0%"
                stop-color="#22D3EE"/>

              <stop
                offset="50%"
                stop-color="#818CF8"/>

              <stop
                offset="100%"
                stop-color="#F472B6"/>

            </linearGradient>

            <filter id="glow">

              <feGaussianBlur
                stdDeviation="3"
                result="blur"/>

              <feMerge>

                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>

              </feMerge>

            </filter>

            <style>
              .mono {{
                font-family:
                  "SFMono-Regular",
                  Consolas,
                  "Liberation Mono",
                  monospace;
              }}
            </style>

          </defs>

          <!-- BACKGROUND -->

          <rect
            width="100%"
            height="100%"
            rx="24"
            fill="url(#bg)"/>

          <!-- BORDER -->

          <rect
            x="1"
            y="1"
            width="{width-2}"
            height="{height-2}"
            rx="24"
            fill="none"
            stroke="#24304A"
            stroke-width="2"/>

          <!-- HEADER -->

          <text
            x="45"
            y="42"
            class="mono"
            font-size="17"
            font-weight="700"
            fill="url(#title)">

            GITHUB // ACTIVITY MATRIX

          </text>

          <text
            x="1050"
            y="42"
            text-anchor="end"
            class="mono"
            font-size="11"
            fill="#64748B">

            REAL DATA

          </text>

          <!-- CONTRIBUTION GRID -->
          '''

          # ---------------------------------------------------------
          # BUILD GRID
          # ---------------------------------------------------------

          first_date = datetime.strptime(
              contributions[0]["date"],
              "%Y-%m-%d"
          ).date()

          # GitHub weeks begin on Sunday.
          first_sunday = first_date

          while first_sunday.weekday() != 6:
              first_sunday -= timedelta(days=1)

          for item in contributions:

              date = datetime.strptime(
                  item["date"],
                  "%Y-%m-%d"
              ).date()

              level = item["level"]

              days_from_start = (
                  date - first_sunday
              ).days

              column = days_from_start // 7
              row = days_from_start % 7

              x = (
                  start_x
                  + column * (cell_size + gap)
              )

              y = (
                  start_y
                  + row * (cell_size + gap)
              )

              fill = colors[level]

              svg += f'''
              <rect
                x="{x}"
                y="{y}"
                width="{cell_size}"
                height="{cell_size}"
                rx="3"
                fill="{fill}"
                stroke="#172033"
                stroke-width="1">

                <title>
                  {item["date"]} — contribution level {level}
                </title>

              </rect>
              '''

          # ---------------------------------------------------------
          # SCAN ANIMATION
          # ---------------------------------------------------------

          svg += f'''

          <rect
            x="{start_x}"
            y="{start_y - 8}"
            width="3"
            height="120"
            fill="#22D3EE"
            opacity="0.75"
            filter="url(#glow)">

            <animate
              attributeName="x"
              from="{start_x}"
              to="{start_x + 950}"
              dur="6s"
              repeatCount="indefinite"/>

          </rect>

          <!-- LEGEND -->

          <text
            x="55"
            y="215"
            class="mono"
            font-size="11"
            fill="#64748B">

            LESS

          </text>
          '''

          legend_x = 95

          for i in range(5):

              svg += f'''

              <rect
                x="{legend_x + i * 25}"
                y="205"
                width="15"
                height="15"
                rx="3"
                fill="{colors[i]}"/>

              '''

          svg += f'''

          <text
            x="{legend_x + 5 * 25 + 5}"
            y="216"
            class="mono"
            font-size="11"
            fill="#64748B">

            MORE

          </text>

          <!-- FOOTER -->

          <text
            x="55"
            y="275"
            class="mono"
            font-size="11"
            fill="#475569">

            SOURCE

          </text>

          <text
            x="115"
            y="275"
            class="mono"
            font-size="11"
            fill="#94A3B8">

            github.com/{USERNAME}

          </text>

          <text
            x="1045"
            y="275"
            text-anchor="end"
            class="mono"
            font-size="11"
            fill="#475569">

            AUTO-SYNC

          </text>

          </svg>
          '''

          with open(
              "assets/contributions.svg",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(svg)

          print(
              "Contribution SVG generated successfully."
          )

          PY

      - name: Commit updated contribution matrix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contributions.svg

          if git diff --cached --quiet; then
            echo "No contribution changes."
          else
            git commit -m "Update GitHub contribution matrix"
            git push
          fi